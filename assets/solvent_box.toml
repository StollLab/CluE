[structure]
  file = "water_gly_20pc_vol.pdb"
  radius = 60

[conditions]
  magnetic_field = 1.2
  temperature = 50

[pulse_sequence]
  sequence = "hahn"
  tau_increments = [5e-2]
  number_timepoints = [301]

[cluster_expansion]
  method = "cce"
  max_cluster_size = 2
  populations = "thermal"

[cluster_expansion.clustering]
  max_spins = 2
  partitioning = "singles"

[run]
  number_runs = 1

[detected_spin]
  position = [25.0,25.0,25.0]
  g_matrix.values = [2.00841, 2.00604, 2.00223]
  g_matrix.axes.x = "random"
  g_matrix.axes.y = "random"

  
  
[orientations]
grid = "random"
number = 1

[output]
  auxiliary_signals = false
  bath = true
  clusters = false
  info = true
  exchange_groups = true
  structure_pdb = true
  orientation_signals = false


[[groups]]
name = "CLOSE_H"
include.distance = [0.0, 4.0]
1H.active = false
  
[[groups]]
name = "WATER_H"
include.residues = "SOL"
include.elements = "H"
include.distance = [4.0, inf]

drop_probability = 0.99

2H.electric_quadrupole.values = [-0.2134,-0.2134,0.4268]
2H.electric_quadrupole.axes.x = "random"
2H.electric_quadrupole.axes.y = "random"

[[groups]]
name = "GLYCEROL_OH"
include.residues = "GLY"
include.elements = "H"
include.bonded_to.elements = "O"
include.distance = [4.0, inf]

drop_probability = 0.99

2H.electric_quadrupole.values = [-0.2134,-0.2134,0.4268]
2H.electric_quadrupole.axes.x = "random"
2H.electric_quadrupole.axes.y = "random"

[[groups]]
name = "GLYCEROL_CH"
include.residues = "GLY"
include.elements = "H"
include.bonded_to.elements = "C"
include.distance = [4.0, inf]

cosubstitute = "same_molecule"

drop_probability = 0.99

2H.electric_quadrupole.values = [-0.1945,-0.1945,0.389]
2H.electric_quadrupole.axes.x = "random"
2H.electric_quadrupole.axes.y = "random"
