[package]
name = "pyclue"
version = "0.1.0-alpha.5"
edition = "2018"
# Resolver 2 applies target-specific dependency features (e.g. the unix and
# windows ndarray-linalg backends in ../Cargo.toml) only on their own target.
# The edition-2018 default (resolver 1) enables both backends on every target.
resolver = "2"

[lib]
name = "clue_oxide"
crate-type = ["cdylib"]

[dependencies.clue_oxide]
path = "../"

[dependencies.pyo3]
version = "0.24.0"
features = ["extension-module","num-complex","serde"]

[dependencies]
ndarray = '0.16.0'
num-complex = "0.4"
numpy  = "0.24.0"

rand_chacha = "0.3.1"

toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

